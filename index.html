<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lingo: ilk harfi verilen Türkçe kelimeyi 5 tahminde bul. TV yarışması kurallarıyla (kırmızı kare, sarı daire, Lingo kartı) tarayıcıda oynanan ücretsiz kelime oyunu.">
  <title>Lingo – Türkçe Kelime Oyunu</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f2efe6'/%3E%3Crect x='5' y='9' width='10' height='10' rx='1.5' fill='%23b5432c'/%3E%3Ccircle cx='22' cy='14' r='5' fill='%23c2963a'/%3E%3Cpath d='M5 25h22' stroke='%2322334f' stroke-width='2' opacity='.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="tv">
  <header class="topbar">
    <div class="brand">
      <span class="kicker">Etkileşimli Kelime Oyunu · TRT 1 formatı</span>
      <h1>Lingo <span>Tahtası</span></h1>
    </div>
    <nav class="actions" aria-label="Menü">
      <button id="btn-home" class="icon-btn" title="Ana menü" aria-label="Ana menü">⌂ <span class="btn-lbl">Menü</span></button>
      <button id="btn-help" class="icon-btn" title="Nasıl oynanır?" aria-label="Nasıl oynanır">? <span class="btn-lbl">Kurallar</span></button>
      <button id="btn-stats" class="icon-btn" title="İstatistikler" aria-label="İstatistikler">▤ <span class="btn-lbl">İstatistik</span></button>
      <button id="btn-settings" class="icon-btn" title="Ayarlar" aria-label="Ayarlar">⚙ <span class="btn-lbl">Ayarlar</span></button>
    </nav>
  </header>

  <main id="app">
    <!-- Başlangıç ekranı -->
    <section id="screen-start" class="screen">
      <h1 class="start-title">İlk harfi verilen kelimeyi <em>5 tahminde</em> bul.</h1>
      <p class="start-sub">Doğru yerdeki harf <span class="legend-chip correct">kırmızı kare</span>, kelimede olup yanlış yerdeki harf <span class="legend-chip present">sarı daire</span> ile gösterilir.</p>

      <div class="mode-grid">
        <button class="mode-card" data-mode="solo">
          <span class="mode-fig">Mod I</span>
          <span class="mode-name">Tek Oyuncu</span>
          <span class="mode-desc">Süreye karşı kelimeleri çöz, top çek, LINGO yap.</span>
        </button>
        <button class="mode-card" data-mode="duo">
          <span class="mode-fig">Mod II</span>
          <span class="mode-name">İki Takım</span>
          <span class="mode-desc">Aynı cihazda sırayla oynayın. Yanlış tahminde sıra rakibe geçer.</span>
        </button>
        <button class="mode-card" data-mode="daily">
          <span class="mode-fig">Mod III</span>
          <span class="mode-name">Günün Kelimesi</span>
          <span class="mode-desc">Herkes için aynı 5 harfli kelime. Günde bir hak, sonucunu paylaş.</span>
        </button>
      </div>

      <div class="start-options">
        <div class="opt">
          <label>Harf sayısı</label>
          <div class="segmented" id="opt-length">
            <button data-len="4">4</button>
            <button data-len="5" class="active">5</button>
            <button data-len="6">6</button>
            <button data-len="7">7</button>
          </div>
        </div>
        <div class="opt">
          <label for="opt-timer">Tahmin süresi: <strong id="opt-timer-val">20 sn</strong></label>
          <input type="range" id="opt-timer" min="0" max="60" step="5" value="20">
        </div>
        <div class="opt">
          <label>Kelime sayısı</label>
          <div class="segmented" id="opt-words">
            <button data-words="3">3</button>
            <button data-words="5" class="active">5</button>
            <button data-words="10">10</button>
          </div>
        </div>
        <div class="opt opt-names hidden" id="opt-names">
          <label>Takım adları</label>
          <div class="name-row">
            <input id="team-a" type="text" maxlength="14" value="Kırmızı Takım" aria-label="1. takım adı">
            <input id="team-b" type="text" maxlength="14" value="Mavi Takım" aria-label="2. takım adı">
          </div>
        </div>
      </div>
      <p class="start-footer"><a id="admin-link" class="hidden" href="admin.html">Kelime yönetimi</a></p>
    </section>

    <!-- Oyun ekranı -->
    <section id="screen-game" class="screen hidden">
      <div class="game-layout">
        <div class="play-column">
          <div class="status-row">
            <div id="turn-label" class="turn-label"></div>
            <div id="round-label" class="round-label"></div>
          </div>
          <div class="timer" id="timer" aria-live="off">
            <div class="timer-track"><div id="timer-bar" class="timer-bar"></div></div>
            <span id="timer-text" class="timer-text"></span>
          </div>
          <div id="board" class="board" aria-label="Tahmin tahtası"></div>
          <div id="toast" class="toast" role="status" aria-live="polite"></div>
          <div id="keyboard" class="keyboard" aria-label="Klavye"></div>
        </div>
        <aside class="side-column">
          <div id="scoreboard" class="scoreboard"></div>
          <div id="card-panel" class="card-panel"></div>
          <div id="draw-panel" class="draw-panel hidden"></div>
        </aside>
      </div>
      <div class="plate-caption">Lingo · İlk harf verilir, 5 tahmin, kırmızı kare / sarı daire</div>
    </section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button class="modal-close" id="modal-close" aria-label="Kapat">×</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="js/words.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
